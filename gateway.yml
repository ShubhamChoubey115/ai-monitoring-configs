server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: discovery
          uri: lb://DISCOVERY
          predicates:
            - Path=/discovery/**
        - id: config
          uri: lb://CONFIG-SERVICE
          predicates:
            - Path=/config/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
